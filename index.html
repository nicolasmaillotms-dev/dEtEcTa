<title>SAV Détection Gaz — DETECTA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#12141A;--surface:#1C1F27;--surface2:#252833;--border:#2E3240;
  --text:#EEF0F5;--text2:#9AA0B2;--text3:#5A6075;
  --acc:#FF6A00;--acc2:#FF8C40;--green:#2ECC71;--red:#E74C3C;--blue:#3B82F6;--yellow:#F59E0B;--purple:#8B5CF6;
  --bw:#FFB13D;--msa:#3B82F6;--isc:#FF8A3D;--drag:#FF5C5C;--old:#2ECC71;--rae:#8B5CF6;--crow:#D946EF;--riken:#F472B6;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── TOP BAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-size:16px;font-weight:900;letter-spacing:-.5px}
.badge{background:var(--acc);color:#fff;font-size:9px;font-weight:900;padding:2px 7px;border-radius:4px;letter-spacing:.5px}

/* ── NAV PRINCIPALE ── */
.nav-main{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.nav-main::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:80px;padding:10px 6px;border:none;background:transparent;color:var(--text3);font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav-btn.active{color:var(--acc);border-bottom-color:var(--acc)}

/* ── NAV SECONDAIRE ── */
.nav-sub{display:flex;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.sub-btn{flex:1;padding:8px 6px;border:none;background:transparent;color:var(--text3);font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.sub-btn.active{color:var(--text);border-bottom-color:var(--border)}

/* ── BARRE FILTRES ── */
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.filter-bar.hidden{display:none;}
.filter-inner{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.filter-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;padding:4px 10px;cursor:pointer}
.topbar{position:relative}
.search-wrap{position:relative}
.search-inp{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:9px 36px 9px 12px;outline:none}
.search-inp:focus{border-color:var(--acc)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,106,0,.2);user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 8px rgba(255,106,0,.4)}
.chip:active{opacity:.7}

/* ── CONTENU ── */
.page{flex:1;overflow-y:auto;padding:12px 12px 24px;display:none}
.page.active{display:block}
.result-count{font-size:11px;color:var(--text3);margin-bottom:8px}
.result-count b{color:var(--acc)}

/* ── CARTES ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .1s}
.card:active{border-color:var(--acc)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.card-ref{font-size:14px;font-weight:800;color:var(--text)}
.card-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
.card-desc{font-size:13px;color:var(--text2);margin-bottom:4px}
.card-meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid}
.card-notes{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5;display:none}
.card.open .card-notes{display:block}
.card-prix{font-size:12px;font-weight:700;color:var(--yellow);margin-top:4px}
.warn{color:var(--yellow)!important}
mark{background:rgba(255,106,0,.25);color:var(--acc);border-radius:2px;font-weight:700}

/* ── CATALOGUE ── */
.brand-section{margin-bottom:20px}
.brand-header{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px solid;margin-bottom:10px}
.brand-name{font-size:13px;font-weight:900;letter-spacing:-.3px}
.type-header{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px;padding-left:2px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.cat-card-title{font-size:13px;font-weight:700;margin-bottom:3px}
.cat-card-sub{font-size:11px;color:var(--text2);margin-bottom:4px}
.cat-card-price{font-size:14px;font-weight:800;color:var(--yellow)}
.cat-card-ref{font-size:10px;color:var(--text3)}
.cat-card-notes{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}
.cat-card-warranty{font-size:11px;color:var(--green);margin-top:3px}

/* ── PROTOCOLES ── */
.proto-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.proto-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.proto-brand{font-size:10px;font-weight:800;margin-bottom:2px}
.proto-model{font-size:14px;font-weight:700}
.proto-gases{font-size:11px;color:var(--text3);margin-top:2px}
.proto-body{padding:0 14px 14px;border-top:1px solid var(--border)}
.proto-section{margin-top:10px}
.proto-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.proto-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.proto-step{font-size:12px;line-height:1.6;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}

/* ── CODES ERREUR ── */
.error-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.error-code{font-size:18px;font-weight:900;font-family:monospace;color:var(--red)}
.error-model{font-size:11px;color:var(--text3);margin-top:1px}
.error-desc{font-size:13px;font-weight:600;color:var(--text);margin:6px 0 4px}
.error-notes{font-size:11px;color:var(--text2);line-height:1.6}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999}

/* ── SCROLLBAR ── */
.page::-webkit-scrollbar{width:3px}
.page::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── DEBUG PANEL ── */
#dbg-toggle{position:fixed;bottom:16px;right:16px;z-index:9999;background:#1a1a2e;border:1.5px solid #7c3aed;border-radius:50%;width:36px;height:36px;color:#a78bfa;font-size:14px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px #7c3aed44}
#dbg-panel{position:fixed;bottom:60px;right:8px;left:8px;max-height:55vh;background:#0d0d1a;border:1.5px solid #7c3aed;border-radius:12px;z-index:9998;display:none;flex-direction:column;font-family:monospace;font-size:11px;overflow:hidden}
#dbg-panel.open{display:flex}
#dbg-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#1a1a2e;border-bottom:1px solid #7c3aed33;flex-shrink:0}
#dbg-head span{color:#a78bfa;font-weight:700}
#dbg-tabs{display:flex;gap:4px}
.dt{padding:3px 8px;border-radius:4px;border:1px solid #7c3aed44;background:transparent;color:#6b7077;font-size:10px;cursor:pointer;font-family:monospace}
.dt.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
#dbg-state{padding:10px 12px;overflow-y:auto;flex:1;color:#a78bfa;line-height:1.6}
#dbg-log{padding:4px 0;overflow-y:auto;flex:1;display:none}
.dl{padding:3px 12px;border-bottom:1px solid #1a1a2e;line-height:1.5}
.dl.err{color:#f87171}.dl.warn{color:#fbbf24}.dl.ok{color:#34d399}.dl.info{color:#60a5fa}.dl.action{color:#c084fc}
#dbg-filter-check{padding:8px 12px;overflow-y:auto;flex:1;display:none;color:#e2e8f0}
.dfc-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #1a1a2e22;font-size:10px}
.dfc-ok{color:#34d399}.dfc-warn{color:#fbbf24}.dfc-err{color:#f87171}

</style>
</head>

teur XCell."},{"marque":"MSA Safety","appareil":"ALTAIR 5X","categorie":"Code erreur","souscat":"Pump Fail","ref":"PUMP-FAIL-5X","desc":"Pump Fail — Défaut pompe aspiration","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : filtre pompe obturé, conduit bouché ou pompe défaillante. PROCÉDURE : 1) Nettoyer/remplacer filtre pompe 10114855. 2) Vérifier conduit aspiration. 3) Si débit nul → pompe HS."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"E1 / E2 / E3","ref":"XAMS-ERR-E1E2E3","desc":"E1/E2/E3 — Codes erreur X-am 5000","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"E1 = batterie faible critique → charger. E2 = défaut capteur (capteur XXS non reconnu ou HS) → vérifier installation capteur → remplacer. E3 = défaut communication interne → éteindre/rallumer → si persistant contacter SAV Dräger."},{"marque":"Teledyne GFD (Oldham)","appareil":"OLCT 10N — Fixe numérique RS485","categorie":"Code erreur","souscat":"LED rouge fixe","ref":"OLCT10N-ERR-RED","desc":"LED rouge fixe — Défaut OLCT 10N","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : dépassement alarme ou défaut capteur. PROCÉDURE : 1) Vérifier concentration gaz (faux positif possible). 2) Vérifier calibration (dérive capteur). 3) Acquitter sur contrôleur MX. 4) Si persistant après ventilation zone → capteur défaillant."},{"marque":"Teledyne GFD (Oldham)","appareil":"OLCT 10N — Fixe numérique RS485","categorie":"Code erreur","souscat":"Signal 0 mA ou <1 mA","ref":"OLCT10N-ERR-0MA","desc":"Signal 0 mA — Rupture ligne ou défaut alimentation","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : coupure câble, alimentation coupée, ou court-circuit. PROCÉDURE : 1) Vérifier tension alim. sur bornier (12-30Vdc). 2) Mesurer continuité câble. 3) Vérifier résistance fin de ligne (switch #8 EOL sur dernier module). 4) Vérifier adressage RS485."},{"marque":"Teledyne GFD (Oldham)","appareil":"OLCT 100 XP — Fixe antidéflagrant","categorie":"Code erreur","souscat":"Signal 2 mA (maintenance)","ref":"OLCT100-MAINT","desc":"Signal 2 mA — Mode maintenance OLCT 100","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Ce n'est pas un code erreur mais un état : 2 mA = mode maintenance/calibration. Le contrôleur doit inhiber les alarmes pendant cet état. Si 2 mA permanent sans action terrain : capteur en dérive ou PCB défaillant."},{"marque":"ISC Industrial Scientific","appareil":"Ventis MX4","categorie":"Code erreur","souscat":"Sensor Fail","ref":"VENTIS-SENSOR-FAIL","desc":"Sensor Fail — Capteur iSensor non reconnu","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : capteur iSensor non reconnu (puce I2C défaillante) ou mauvaise insertion. PROCÉDURE : 1) Retirer et réinsérer le capteur iSensor. 2) Vérifier contacts. 3) Tester avec capteur connu bon. 4) Vérifier que le capteur est compatible Ventis MX4 (format iSensor exclusif ISC)."},{"marque":"Crowcon","appareil":"T4 / T4x","categorie":"Code erreur","souscat":"Sensor Fault","ref":"T4X-SENSOR-FAULT","desc":"Sensor Fault — Défaut capteur T4x","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : capteur défaillant ou fin de vie. Dual Toxic : garantie 3 ans. LLO2 : vérifier date fab. MPS : insensible aux poisons mais vieillissement mécanique possible. PROCÉDURE : remplacer le capteur défaillant."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Démarrage — Détecteur ne s'allume pas","ref":"MC-ERR-START","desc":"Détecteur ne s'allume pas","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : batterie déchargée ou détecteur défectueux. REMÈDE : 1) Charger la batterie complètement (LED orange pendant charge → verte quand pleine). 2) Si batterie neuve et toujours rien → détecteur défectueux, contacter SAV."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Démarrage — Alarme immédiate à l'allumage","ref":"MC-ERR-ALARM-START","desc":"Alarme dès l'allumage en atmosphère sûre","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE 1 : capteur doit se stabiliser (capteur récent 5 min / capteur ancien 60s / O2 sur X3 = 60 min). CAUSE 2 : batterie faible (Low Batt). CAUSE 3 : alarme réelle — quitter la zone immédiatement et tester en air propre (20.9% O2). REMÈDE : attendre stabilisation puis recalibrer si nécessaire."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Démarrage — Échec self-test","ref":"MC-ERR-SELFTEST","desc":"Échec du self-test au démarrage","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : défaillance capteur lors de l'auto-test interne. REMÈDE : 1) Calibrer le(s) capteur(s). 2) Rallumer. 3) Si erreur persiste → remplacer le capteur défaillant."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Démarrage — Arrêt automatique","ref":"MC-ERR-AUTOSTOP","desc":"Arrêt automatique pendant le démarrage","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE 1 : option Force Calibration active et calibration non effectuée → calibrer immédiatement. CAUSE 2 : option Force Bump Test active et bump test non effectué → réaliser bump test. CAUSE 3 : batterie trop faible → charger."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Calibration — Fail CAL","ref":"MC-ERR-FAILCAL","desc":"FAIL affiché après calibration (échec étalonnage)","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : dérive capteur trop importante, cellule empoisonnée, gaz étalon insuffisant ou périmé, fuite au bouchon. REMÈDE : 1) Vérifier pression cylindre. 2) Vérifier débit (50 mL/min). 3) Vérifier joint torique bouchon MCXL-CAP. 4) Vérifier date péremption gaz. 5) Si persiste après vérifications → remplacer cellule."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Calibration — CAL OVERDUE","ref":"MC-ERR-CALOVERDUE","desc":"CAL OVERDUE — Calibration échue, étalonnage requis","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : intervalle de calibration configuré dans Fleet Manager II dépassé. Si option 'Force Calibration' activée : l'appareil bloque l'utilisation jusqu'à calibration. REMÈDE : calibrer l'appareil via bouchon MCXL-CAP ou IntelliDox."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Calibration — LAST CAL FAILED","ref":"MC-ERR-LASTCALFAIL","desc":"LAST CAL FAILED — La dernière calibration a échoué","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Affiché au démarrage si la dernière calibration s'est soldée par un échec. REMÈDE : recalibrer immédiatement. Si nouveau échec → remplacer le capteur concerné."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Calibration — LAST BUMP FAILED","ref":"MC-ERR-LASTBUMPFAIL","desc":"LAST BUMP FAILED — Dernier bump test échoué","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Affiché au démarrage si le dernier bump test a échoué. REMÈDE : effectuer un bump test immédiatement. Si échec → recalibrer, puis si toujours en échec → remplacer le capteur."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Opération — Lecture instable","ref":"MC-ERR-DRIFT","desc":"Lecture anormale ou dérive persistante","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE 1 : capteur contaminé (exposition à un poison : silicone, halogènes, H2S concentré sur CatEx). CAUSE 2 : cellule EC en fin de vie. CAUSE 3 : membrane encrassée. REMÈDE : 1) Vérifier/remplacer membrane (CP-SS ou filtre MicroClip). 2) Calibrer en air propre. 3) Si dérive > 10% PE → remplacer la cellule."},{"marque":"BW Honeywell","appareil":"GasAlert MicroClip XL / X3","categorie":"Code erreur","souscat":"Opération — IR LOCK","ref":"MC-ERR-IRLOCK","desc":"IR LOCK — Calibration uniquement par dispositif IR","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Option activée via Fleet Manager II ou SafetySuite. La calibration manuelle par bouton est désactivée — utiliser un lien IR ou IntelliDox pour calibrer."},{"marque":"BW Honeywell","appareil":"GasAlert Flex 4 IR","categorie":"Code erreur","souscat":"Error 4006 — Défaut comm. capteur","ref":"FLEX-ERR-4006","desc":"Error 4006 — Rupture communication entre PCB et capteur","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : capteur mal inséré, non reconnu ou défaillant. PROCÉDURE : 1) Vérifier insertion correcte de chaque capteur. 2) Attendre stabilisation (EC = 30 min, O2 = 24h après installation). 3) Tester avec capteur de remplacement connu bon. 4) Si persiste → vérifier le menu HARDWARE pour identifier la config PCB → remplacer PCB (CP-MPCB5 à CP-MPCB11)."},{"marque":"BW Honeywell","appareil":"GasAlert Flex 4 IR","categorie":"Code erreur","souscat":"Error 1006 — Température PCB","ref":"FLEX-ERR-1006","desc":"Error 1006 — Capteur température interne PCB hors plage","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : T° ambiante extrême (< -20°C ou > 50°C) ou défaut interne PCB. REMÈDE : 1) Ramener l'appareil à T° ambiante 20°C. 2) Éteindre 5 min. Rallumer. 3) Si erreur persiste hors conditions extrêmes → remplacer PCB (vérifier config dans menu HARDWARE)."},{"marque":"BW Honeywell","appareil":"GasAlert Flex 4 IR","categorie":"Code erreur","souscat":"Error 1007 — Mémoire Flash","ref":"FLEX-ERR-1007","desc":"Error 1007 — Corruption mémoire Flash interne","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : corruption mémoire non-volatile (Flash) sur PCB. REMÈDE : 1) Éteindre/rallumer (cycle alimentation). 2) Si persiste → remplacer PCB (CP-MPCB5 à CP-MPCB11 selon config slots HARDWARE)."},{"marque":"BW Honeywell","appareil":"GasAlert Flex 4 IR","categorie":"Code erreur","souscat":"Error 1008 — Module BLE","ref":"FLEX-ERR-1008","desc":"Error 1008 — Défaut module Bluetooth interne","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : module BLE interne défaillant. REMÈDE : 1) Désactiver le Bluetooth dans les paramètres de l'appareil. 2) Tester en mode non-BLE. 3) Si problème opérationnel persiste → remplacer PCB."},{"marque":"BW Honeywell","appareil":"GasAlert Flex 4 IR","categorie":"Code erreur","souscat":"IR LEL — Lecture basse ou nulle","ref":"FLEX-ERR-IR-LOW","desc":"Capteur IR LEL : lecture faible ou nulle à la calibration","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE 1 : préchauffage IR insuffisant (< 5 min). CAUSE 2 : membrane obturée (CP-SS). CAUSE 3 : capteur IR fin de vie (source IR ~5 ans). REMÈDE : 1) Attendre 5 min complet après allumage. 2) Vérifier/remplacer membrane. 3) Tester gaz étalon propane 50% LEL. 4) Si réponse < 50% → remplacer SR-W5-1S."},{"marque":"MSA Safety","appareil":"ALTAIR 4XR","categorie":"Code erreur","souscat":"ADC Error","ref":"ALTAIR4XR-ADC-ERR","desc":"ADC Error — Erreur convertisseur analogique/numérique","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : défaillance interne du convertisseur A/N sur PCB. REMÈDE : contacter MSA Safety / SAV. Retrait de service obligatoire."},{"marque":"MSA Safety","appareil":"ALTAIR 4XR","categorie":"Code erreur","souscat":"Comb Error","ref":"ALTAIR4XR-COMB-ERR","desc":"Comb Error — Erreur circuit capteur combustible","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : défaillance circuit LEL interne. REMÈDE : retirer de service, contacter MSA."},{"marque":"MSA Safety","appareil":"ALTAIR 4XR","categorie":"Code erreur","souscat":"Mem Error","ref":"ALTAIR4XR-MEM-ERR","desc":"Mem Error — Erreur mémoire","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : corruption mémoire interne. REMÈDE : contacter MSA. Retrait de service."},{"marque":"MSA Safety","appareil":"ALTAIR 4XR","categorie":"Code erreur","souscat":"Missing Sensor","ref":"ALTAIR4XR-MISS-SENSOR","desc":"Missing Sensor — Capteur XCell absent ou non reconnu","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : capteur XCell non inséré, mal positionné ou puce EEPROM défaillante. REMÈDE : 1) Retirer et réinsérer le capteur. 2) Nettoyer contacts. 3) Tester avec capteur connu bon. 4) Si persistant → capteur XCell défaillant, remplacer (10106722 à 10116920 selon gaz)."},{"marque":"MSA Safety","appareil":"ALTAIR 4XR","categorie":"Code erreur","souscat":"Sensor Warning ♥","ref":"ALTAIR4XR-SENSOR-WARN","desc":"♥ clignotant — Capteur en fin de vie approchante","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : sensibilité du capteur XCell détectée en baisse lors de la calibration. Le capteur reste opérationnel. REMÈDE : planifier remplacement du capteur défaillant avant la fin de vie. Si le ♥ est FIXE → fin de vie atteinte, calibration impossible → remplacer immédiatement."},{"marque":"MSA Safety","appareil":"ALTAIR 4XR","categorie":"Code erreur","souscat":"Sensor Alarm ♥ fixe","ref":"ALTAIR4XR-SENSOR-ALARM","desc":"♥ fixe — Fin de vie capteur, calibration impossible","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"CAUSE : fin de vie capteur XCell atteinte. La calibration span échoue car le capteur ne peut plus être calibré. REMÈDE : remplacer immédiatement le capteur XCell concerné puis recalibrer."},{"marque":"MSA Safety","appareil":"ALTAIR 4XR","categorie":"Code erreur","souscat":"Sensor Warning calibration — gaz périmé ou mal utilisé","ref":"ALTAIR4XR-CAL-GAS","desc":"Sensor Warning/Alarm à la calibration sans perte réelle de sensibilité","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : docs.msasafety.com. CAUSE : gaz étalon périmé, mauvaise concentration appliquée, fuite au bouchon ou débit insuffisant. REMÈDE : 1) Vérifier date péremption cylindre. 2) Vérifier débit (0.5 L/min). 3) Vérifier bouchon/coupe calibration. 4) Réessayer avec nouveau cylindre."},{"marque":"MSA Safety","appareil":"ALTAIR 5X","categorie":"Code erreur","souscat":"Pump Fail / Flow Error","ref":"ALTAIR5X-PUMP-FAIL","desc":"Pump Fail — Défaut pompe ou obstruction circuit aspiration","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice ALTAIR 5X. TEST BLOCAGE POMPE au démarrage : au démarrage, l'appareil demande de bloquer l'entrée pompe. Si blocage non détecté → erreur affichée et extinction. CAUSE opération : filtre pompe obturé (10114855) ou conduit bouché. REMÈDE : 1) Remplacer filtre pompe. 2) Vérifier tuyau aspiration. 3) Si débit nul persistant → pompe HS → contacter MSA."},{"marque":"MSA Safety","appareil":"ALTAIR 5X","categorie":"Code erreur","souscat":"Prog Error / Ram Error","ref":"ALTAIR5X-PROG-RAM","desc":"Prog Error / Ram Error — Erreur programme ou RAM","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice ALTAIR 5X p.57. CAUSE : défaillance interne critique (firmware ou RAM). REMÈDE : retrait de service immédiat, contacter MSA."},{"marque":"MSA Safety","appareil":"ALTAIR 5X","categorie":"Code erreur","souscat":"Sensors installés en mauvaise position","ref":"ALTAIR5X-SENSOR-POS","desc":"Alarme ou erreur due à capteurs en positions incorrectes","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice p.46. Les capteurs XCell doivent être installés dans les positions spécifiées en Figure 14 de la notice. Un capteur en mauvaise position déclenche une erreur. REMÈDE : vérifier positions selon Figure 14 et réinstaller correctement."},{"marque":"MSA Safety","appareil":"ALTAIR 5X","categorie":"Code erreur","souscat":"CAL DUE NOW","ref":"ALTAIR5X-CAL-DUE","desc":"CAL DUE, NOW — Calibration requise immédiatement","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice. Affiché quand le nombre de jours avant calibration atteint 0. REMÈDE : calibrer immédiatement via bouchon ou GALAXY GX2. Configurable de 1 à 180 jours dans MSA Link."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 102 — Compteur service vie","ref":"XAMS-102","desc":"Code 102 — Compteur service vie client écoulé","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : réinitialiser le compteur de vie via logiciel Dräger CC-Vision PC. Opération réservée au responsable maintenance ou SAV."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 103 — Appareil défectueux","ref":"XAMS-103","desc":"Code 103 — Appareil défectueux (checksum programme)","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : retour impératif au DrägerService pour réparation. L'appareil ne peut pas être utilisé."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 104 — Bump test dépassé","ref":"XAMS-104","desc":"Code 104 — Intervalle bump test dépassé","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : effectuer un bump test (test fonctionnel gaz) avec le X-dock ou manuellement."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 105 — Calibration dépassée","ref":"XAMS-105","desc":"Code 105 — Intervalle calibration dépassé (≥1 canal)","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : effectuer calibration span (page 40 ou 42 de la notice)."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 106 — Erreur bump test","ref":"XAMS-106","desc":"Code 106 — Erreur bump test (au moins 1 canal en erreur)","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. CAUSE : capteur ayant perdu plus de 50% de sensibilité. REMÈDE : effectuer calibration span complète. Si toujours en erreur → remplacer capteur XXS défaillant."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 107 — Appareil défectueux","ref":"XAMS-107","desc":"Code 107 — Appareil défectueux (autre)","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : retour DrägerService. Retrait de service obligatoire."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 111-114 — Échec test éléments alarme","ref":"XAMS-111-114","desc":"Codes 111/112/113/114 — Échec test LED / buzzer / vibreur / inspection visuelle","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : répéter le test des éléments d'alarme via X-dock. Code 111 = LED. Code 112 = buzzer. Code 113 = vibreur. Code 114 = inspection visuelle. Si persistant → retour DrägerService."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 115 — Désactivé par X-dock","ref":"XAMS-115","desc":"Code 115 — Appareil désactivé par X-dock","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : ré-activer l'appareil via la station X-dock."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 201 — Zéro CatEx non valide","ref":"XAMS-201","desc":"Code 201 — Zéro point CatEx 125 PR non valide","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : effectuer calibration air frais (fresh air calibration, page 38 notice)."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Code 202 — Span CatEx non valide","ref":"XAMS-202","desc":"Code 202 — Sensibilité CatEx 125 PR non valide","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5000 p.27. REMÈDE : effectuer calibration span (page 40 ou 42 notice)."},{"marque":"Dräger","appareil":"X-am 5000","categorie":"Code erreur","souscat":"Warm-up error — Accélération chauffe","ref":"XAMS-WARMUP","desc":"Erreur pendant la phase warm-up (accélération de chauffe)","gamme":"—","techno":"Diagnostic","prix_eur":"","notes":"Source : notice X-am 5600   "RAE Systems (Honeywell)":"#8B5CF6","Crowcon":"#D946EF","Riken Keiki":"#F472B6",
  "Compatibilité inter-marques":"#F59E0B"

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
  section: 'fixe',   // fixe | portable | protocoles | erreurs
  sub: 'catalogue',  // catalogue | pieces
  query: '',
  marque: null,
  appareil: null,
  filterOpen: true,
  _calibOpen: null,
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function hl(text, q) {
  if(!q||!text) return esc(text);
  const t = q.toLowerCase().split(/\s+/).filter(Boolean);
  let r = esc(text);
  t.forEach(w => { if(!w) return; const re = new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); r=r.replace(re,'<mark>$1</mark>'); });
  return r;
}

function bc(m){ return BRAND_COLORS[m]||'#9AA0B2'; }
function tc(t){ return TECHNO_COLORS[t]||'#9AA0B2'; }

function uniq(arr){ return [...new Set(arr)]; }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0',1500);
}

function copyRef(ref){
  navigator.clipboard?.writeText(ref).then(()=>showToast('Référence copiée : '+ref)).catch(()=>showToast(ref));
}

// ─── DONNÉES FILTRÉES ─────────────────────────────────────────────────────────
function isFixed(d){ return ['Boitier fixe','Cellule capteur','Carte électronique','Accessoire fixe','Centrale détection','Module centrale'].includes(d.categorie) || d.techno==='Fixe' || (d.appareil&&d.appareil.includes('fixe')); }
function isPortable(d){ return ['Capteur','Boitier','Electronique','Accessoire'].includes(d.categorie) && !isFixed(d); }
function isError(d){ return d.categorie==='Code erreur'; }
function isCatalogue(d){ return d.categorie==='Appareil neuf'; }
function isCompat(d){ return ['Compatibilité','Règle'].includes(d.categorie)||d.marque==='Compatibilité inter-marques'; }

function getFiltered(baseFilter){
  return DATA.filter(d => {
    if(!baseFilter(d)) return false;
    if(S.marque && d.marque!==S.marque) return false;
    if(S.appareil && d.appareil!==S.appareil) return false;
    if(!S.query) return true;
    const hay = [d.marque,d.appareil,d.ref,d.desc,d.gamme,d.souscat,d.notes,d.techno].join(' ').toLowerCase();
    return S.query.toLowerCase().split(/\s+/).every(t=>hay.includes(t));
  });
}

// ─── RENDU CHIPS ─────────────────────────────────────────────────────────────
function renderChips(baseFilter){
  const pool = DATA.filter(baseFilter);
  const marques = uniq(pool.map(d=>d.marque)).filter(m=>m&&m!=='Compatibilité inter-marques').sort();
  const mEl = document.getElementById('marqueChips');
  
  mEl.innerHTML = marques.map(m=>`<button class="chip${S.marque===m?' on':''}" data-marque="${m.replace(/"/g,'&quot;')}" style="color:${S.marque===m?'#fff':bc(m)};border-color:${bc(m)}33">${esc(m)}</button>`).join('');
  
  // Event delegation sur le parent (plus fiable sur mobile)
  mEl.onclick = function(e){
    const btn = e.target.closest('button[data-marque]');
    if(!btn) return;
    const m = btn.getAttribute('data-marque');
    S.marque = S.marque===m ? null : m;
    S.appareil = null;
    renderPage();
  };

  const appEl = document.getElementById('appChips');
  if(S.marque){
    const apps = uniq(pool.filter(d=>d.marque===S.marque).map(d=>d.appareil)).sort();
    appEl.innerHTML = apps.map(a=>`<button class="chip${S.appareil===a?' on':''}" data-app="${a.replace(/"/g,'&quot;')}">${esc(a)}</button>`).join('');
    appEl.onclick = function(e){
      const btn = e.target.closest('button[data-app]');
      if(!btn) return;
      const a = btn.getAttribute('data-app');
      S.appareil = S.appareil===a ? null : a;
      renderPage();
    };
  } else {
    appEl.innerHTML='';
    appEl.onclick = null;
  }
}

// ─── RENDU CARTE PIÈCE ───────────────────────────────────────────────────────
function pieceCard(d){
  const q=S.query;
  const color=bc(d.marque);
  const isWarn = d.notes && (d.notes.includes('⚠')||d.notes.includes('INTERDIT')||d.notes.includes('obligatoire'));
  const prix = d.prix_eur ? `<div class="card-prix">💶 ${esc(d.prix_eur)} € HT</div>` : '';
  return `<div class="card" onclick="toggleCard(this);copyRef('${esc(d.ref)}')">
    <div class="card-top">
      <div class="card-ref" style="color:${color}">${hl(d.ref,q)}</div>
      <span class="card-badge" style="background:${tc(d.techno)}22;color:${tc(d.techno)};border:1px solid ${tc(d.techno)}44">${esc(d.techno)}</span>
    </div>
    <div class="card-desc">${hl(d.desc,q)}</div>
    <div class="card-meta">
      ${d.gamme&&d.gamme!=='—'?`<span class="tag" style="background:${color}15;color:${color};border-color:${color}30">${hl(d.gamme,q)}</span>`:''}
      <span class="tag" style="background:#ffffff08;color:var(--text3);border-color:var(--border)">${esc(d.categorie)} · ${esc(d.souscat||'')}</span>
    </div>
    ${prix}
    <div class="card-notes ${isWarn?'warn':''}">${hl(d.notes,q)}</div>
  </div>`;
}

function toggleCard(el){
  el.classList.toggle('open');
}

// ─── PAGE PIÈCES ─────────────────────────────────────────────────────────────
function renderPieces(baseFilter, pageId){
  const filtered = getFiltered(baseFilter);
  const el = document.getElementById(pageId);
  if(!el) return;
  const q=S.query;
  if(filtered.length===0){
    el.innerHTML=`<div style="text-align:center;color:var(--text3);padding:40px 0;font-size:13px">Aucun résultat${q?' pour "'+esc(q)+'"':''}</div>`;
    return;
  }
  // Grouper par marque puis appareil
  const byMarque={};
  filtered.forEach(d=>{
    if(!byMarque[d.marque])byMarque[d.marque]=[];
    byMarque[d.marque].push(d);
  });
  let html=`<div class="result-count"><b>${filtered.length}</b> référence${filtered.length>1?'s':''}</div>`;
  Object.keys(byMarque).sort().forEach(m=>{
    const color=bc(m);
    const byApp={};
    byMarque[m].forEach(d=>{if(!byApp[d.appareil])byApp[d.appareil]=[];byApp[d.appareil].push(d);});
    html+=`<div class="brand-section"><div class="brand-header" style="border-color:${color}"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block"></span><span class="brand-name" style="color:${color}">${esc(m)}</span></div>`;
    Object.keys(byApp).sort().forEach(app=>{
      html+=`<div class="type-header">${esc(app)}</div>`;
      byApp[app].forEach(d=>{ html+=pieceCard(d); });
    });
    html+=`</div>`;
  });
  el.innerHTML=html;
}

// ─── PAGE CATALOGUE ───────────────────────────────────────────────────────────
function renderCatalogue(isFixedFilter, pageId){
  const filtered = DATA.filter(d=>isCatalogue(d)&&(isFixedFilter?d.techno==='Fixe':d.techno==='Portable'));
  const el=document.getElementById(pageId);
  if(!el) return;

  const byMarque={};
  filtered.forEach(d=>{if(!byMarque[d.marque])byMarque[d.marque]=[];byMarque[d.marque].push(d);});

  let html='<div style="font-size:11px;color:var(--text3);margin-bottom:12px">Prix indicatifs HT distributeurs FR — juillet 2026</div>';
  Object.keys(byMarque).sort().forEach(m=>{
    const color=bc(m);
    html+=`<div class="brand-section"><div class="brand-header" style="border-color:${color}"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block"></span><span class="brand-name" style="color:${color}">${esc(m)}</span></div>`;
    byMarque[m].forEach(d=>{
      const priceM = d.notes&&d.notes.match(/~([\d\s\-]+EUR[^.]*)/);
      const price = priceM?priceM[1].trim():'—';
      const warM = d.notes&&d.notes.match(/[Gg]arantie\s+([^.]+?)\./);
      const war = warM?warM[1]:'';
      html+=`<div class="cat-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1">
            <div class="cat-card-title">${esc(d.appareil)}</div>
            <div class="cat-card-sub">${esc(d.desc)}</div>
            <div class="cat-card-ref">Réf. ${esc(d.ref)}</div>
            ${d.gamme&&d.gamme!=='—'?`<div style="font-size:11px;color:var(--text3);margin-top:3px">${esc(d.gamme)}</div>`:''}
            ${war?`<div class="cat-card-warranty">✓ Garantie ${esc(war)}</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0"><div class="cat-card-price">${esc(price)}</div></div>
        </div>
        <div class="cat-card-notes">${esc(d.notes)}</div>
      </div>`;
    });
    html+=`</div>`;
  });
  el.innerHTML=html;
}

// ─── PAGE PROTOCOLES ──────────────────────────────────────────────────────────
let _calibOpen=null;
function renderProtocoles(){
  const el=document.getElementById('page-protocoles');
  if(!el) return;
  const q=S.query.toLowerCase();
  const filtered=CALIB_PROTOCOLS.filter(p=>{
    if(!q) return true;
    const hay=[p.brand,p.model,...p.gas_types,...(p.steps||[])].join(' ').toLowerCase();
    return q.split(/\s+/).every(t=>hay.includes(t));
  });
  let html=`<div class="result-count"><b>${filtered.length}</b> protocole${filtered.length>1?'s':''} · Tap pour déplier</div>`;
  filtered.forEach(p=>{
    const open=_calibOpen===p.id;
    const color=bc(p.brand);
    html+=`<div class="proto-card" style="border-color:${open?color:'var(--border)'}">
      <div class="proto-hdr" onclick="toggleProto('${p.id}')">
        <div>
          <div class="proto-brand" style="color:${color}">${esc(p.brand)}</div>
          <div class="proto-model">${esc(p.model)}</div>
          <div class="proto-gases">${p.gas_types.slice(0,5).map(g=>esc(g)).join(' · ')}${p.gas_types.length>5?'…':''}</div>
        </div>
        <div style="font-size:16px;color:var(--text3)">${open?'▲':'▼'}</div>
      </div>`;
    if(open){
      html+=`<div class="proto-body">`;
      // Outils
      html+=`<div class="proto-section"><div class="proto-label">🔧 Outils requis</div>`;
      p.tools.forEach(t=>html+=`<div style="font-size:12px;color:var(--text2);padding:2px 0;border-bottom:1px solid var(--border)">${esc(t)}</div>`);
      html+=`</div>`;
      // Stabilisation
      if(p.stab&&Object.keys(p.stab).length){
        html+=`<div class="proto-section"><div class="proto-label">⏱ Stabilisation</div>`;
        Object.entries(p.stab).forEach(([k,v])=>{
          const c=v>=360?'var(--red)':v>=120?'var(--yellow)':'var(--green)';
          html+=`<div class="proto-row"><span style="color:var(--text2)">${esc(k)}</span><span style="color:${c};font-weight:700">${v>=60?v/60+'h':v+'min'}</span></div>`;
        });
        html+=`</div>`;
      }
      // Concentrations
      if(p.concs&&Object.keys(p.concs).length){
        html+=`<div class="proto-section"><div class="proto-label">🧪 Gaz étalon</div>`;
        Object.entries(p.concs).forEach(([k,v])=>{
          html+=`<div class="proto-row"><span style="color:var(--text2)">${esc(k)}</span><span style="color:var(--yellow);font-weight:600">${esc(v)}</span></div>`;
        });
        html+=`</div>`;
      }
      // Étapes
      if(p.steps&&p.steps.length){
        html+=`<div class="proto-section"><div class="proto-label">📋 Procédure</div>`;
        p.steps.forEach(s=>{
          const w=s.startsWith('⚠');
          const b=s.startsWith('<b>');
          const c=w?'var(--yellow)':b?'var(--text)':'var(--text2)';
          const fw=(w||b)?'600':'400';
          const txt=b?s.replace(/<\/?b>/g,''):esc(s);
          html+=`<div class="proto-step" style="color:${c};font-weight:${fw}">${txt}</div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  el.innerHTML=html;
}
function toggleProto(id){ _calibOpen=_calibOpen===id?null:id; renderProtocoles(); }

// ─── ROUTER ──────────────────────────────────────────────────────────────────
function showSubNav(show){
  document.getElementById('navSub').style.display=show?'flex':'none';
}

function renderPage(){
  // Cacher toutes les pages
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

  const s=S.section, sub=S.sub;
  const baseFixed = d=>!isCatalogue(d)&&!isError(d)&&!isCompat(d)&&isFixed(d);
  const basePort  = d=>!isCatalogue(d)&&!isError(d)&&!isCompat(d)&&isPortable(d);

  if(s==='fixe'){
    showSubNav(true);
    if(sub==='catalogue'){
      renderCatalogue(true,'page-fixe-catalogue');
      document.getElementById('page-fixe-catalogue').classList.add('active');
      renderChips(d=>isCatalogue(d)&&d.techno==='Fixe');
    } else {
      renderPieces(baseFixed,'page-fixe-pieces');
      document.getElementById('page-fixe-pieces').classList.add('active');
      renderChips(baseFixed);
    }
  } else if(s==='portable'){
    showSubNav(true);
    if(sub==='catalogue'){
      renderCatalogue(false,'page-portable-catalogue');
      document.getElementById('page-portable-catalogue').classList.add('active');
      renderChips(d=>isCatalogue(d)&&d.techno==='Portable');
    } else {
      renderPieces(basePort,'page-portable-pieces');
      document.getElementById('page-portable-pieces').classList.add('active');
      renderChips(basePort);
    }
  } else if(s==='protocoles'){
    showSubNav(false);
    renderProtocoles();
    document.getElementById('page-protocoles').classList.add('active');
    document.getElementById('marqueChips').innerHTML='';
    document.getElementById('appChips').innerHTML='';
  } else if(s==='erreurs'){
    showSubNav(false);
    renderErreurs();
    document.getElementById('page-erreurs').classList.add('active');
    // chips marque pour erreurs
    const errMarques=uniq(DATA.filter(isError).map(d=>d.marque)).sort();
    const mEl=document.getElementById('marqueChips');
    mEl.innerHTML=errMarques.map(m=>`<button class="chip${S.marque===m?' on':''}" data-marque="${esc(m)}" style="color:${S.marque===m?'#fff':bc(m)};border-color:${bc(m)}33">${esc(m)}</button>`).join('');
    mEl.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{S.marque=S.marque===b.dataset.marque?null:b.dataset.marque;renderPage();}));
    document.getElementById('appChips').innerHTML='';
  }
}

// ════════════════════════════════════════════════════════
// AUTO-DEBUG PANEL
// ════════════════════════════════════════════════════════
(function(){
  const MAX_LOG = 200;
  const logs = [];
  let dbgTab = 'state';

  // ── Intercepter console ──
  const _log = console.log.bind(console);
  const _warn = console.warn.bind(console);
  const _err = console.error.bind(console);
  console.log   = function(){_log(...arguments);dbgLog('info', [...arguments].join(' '));};
  console.warn  = function(){_warn(...arguments);dbgLog('warn', [...arguments].join(' '));};
  console.error = function(){_err(...arguments);dbgLog('err', [...arguments].join(' '));};

  // ── Intercepter erreurs globales ──
  window.addEventListener('error', e=>{
    dbgLog('err', `[JS ERROR] ${e.message} @ ${e.filename}:${e.lineno}`);
  });
  window.addEventListener('unhandledrejection', e=>{
    dbgLog('err', `[PROMISE] ${e.reason}`);
  });

  function dbgLog(type, msg){
    const t = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    logs.unshift({type, msg, t});
    if(logs.length > MAX_LOG) logs.pop();
    if(dbgTab==='log') renderLog();
  }

  // ── Créer le HTML ──
  const toggle = document.createElement('button');
  toggle.id = 'dbg-toggle';
  toggle.textContent = '🐛';
  toggle.title = 'Debug Panel';
  document.body.appendChild(toggle);

  const panel = document.createElement('div');
  panel.id = 'dbg-panel';
  panel.innerHTML = `
    <div id="dbg-head">
      <span>🐛 DEBUG — SAV Gaz</span>
      <div id="dbg-tabs">
        <button class="dt on" data-t="state">État</button>
        <button class="dt" data-t="filter">Filtres</button>
        <button class="dt" data-t="log">Console</button>
      </div>
    </div>
    <div id="dbg-state"></div>
    <div id="dbg-log"></div>
    <div id="dbg-filter-check"></div>
  `;
  document.body.appendChild(panel);

  // ── Toggle ──
  toggle.addEventListener('click', ()=>{
    panel.classList.toggle('open');
    if(panel.classList.contains('open')) renderDbg();
  });

  // ── Tabs ──
  panel.querySelector('#dbg-tabs').addEventListener('click', e=>{
    const btn = e.target.closest('.dt');
    if(!btn) return;
    dbgTab = btn.dataset.t;
    panel.querySelectorAll('.dt').forEach(b=>b.classList.toggle('on', b===btn));
    renderDbg();
  });

  function renderDbg(){
    if(dbgTab==='state') renderState();
    else if(dbgTab==='log') renderLog();
    else if(dbgTab==='filter') renderFilterCheck();
  }

  // ── Onglet ÉTAT ──
  function renderState(){
    const el = document.getElementById('dbg-state');
    el.style.display='block';
    document.getElementById('dbg-log').style.display='none';
    document.getElementById('dbg-filter-check').style.display='none';

    // Récupérer S (state global)
    let stateStr = '(S non accessible)';
    try {
      if(typeof S !== 'undefined'){
        stateStr = Object.entries(S).map(([k,v])=>`  <span style="color:#60a5fa">${k}</span>: <span style="color:#fbbf24">${JSON.stringify(v)}</span>`).join('<br>');
      }
    } catch(e){ stateStr = '(erreur: '+e.message+')'; }

    // Compter les données
    let dataInfo = '(DATA non accessible)';
    try {
      if(typeof DATA !== 'undefined'){
        const cats = {};
        DATA.forEach(d=>{ cats[d.categorie]=(cats[d.categorie]||0)+1; });
        dataInfo = `<span style="color:#34d399">Total: ${DATA.length}</span><br>` +
          Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,8)
            .map(([k,v])=>`  ${k}: <b>${v}</b>`).join('<br>');
      }
    } catch(e){ dataInfo = '(erreur: '+e.message+')'; }

    // Pages visibles
    let pagesInfo = '';
    try {
      document.querySelectorAll('.page').forEach(p=>{
        const active = p.classList.contains('active');
        pagesInfo += `  <span style="color:${active?'#34d399':'#4b5563'}">${active?'▶':'○'} ${p.id}</span><br>`;
      });
    } catch(e){}

    el.innerHTML = `
<div style="color:#7c3aed;font-weight:700;margin-bottom:4px">── STATE ──</div>
${stateStr}
<div style="color:#7c3aed;font-weight:700;margin:8px 0 4px">── DATA ──</div>
${dataInfo}
<div style="color:#7c3aed;font-weight:700;margin:8px 0 4px">── PAGES ──</div>
${pagesInfo}
<div style="color:#7c3aed;font-weight:700;margin:8px 0 4px">── ACTIONS ──</div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
  <button onclick="if(typeof renderPage!=='undefined')renderPage()" style="padding:4px 10px;background:#1e3a5f;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa;font-size:10px;cursor:pointer">↺ renderPage</button>
  <button onclick="if(typeof S!=='undefined'){S.marque=null;S.appareil=null;S.query='';document.getElementById('searchInp').value='';renderPage();}" style="padding:4px 10px;background:#1a2e1a;border:1px solid #22c55e;border-radius:6px;color:#4ade80;font-size:10px;cursor:pointer">✕ Reset filtres</button>
  <button onclick="if(typeof DATA!=='undefined')console.log('DATA[0]',JSON.stringify(DATA[0]))" style="padding:4px 10px;background:#2e1a1a;border:1px solid #ef4444;border-radius:6px;color:#f87171;font-size:10px;cursor:pointer">📋 Log DATA[0]</button>
</div>
    `;
  }

  // ── Onglet CONSOLE ──
  function renderLog(){
    const el = document.getElementById('dbg-log');
    el.style.display='block';
    document.getElementById('dbg-state').style.display='none';
    document.getElementById('dbg-filter-check').style.display='none';
    if(logs.length===0){
      el.innerHTML='<div class="dl info">Aucun log pour l\'instant.</div>';
      return;
    }
    el.innerHTML = logs.map(l=>
      `<div class="dl ${l.type}"><span style="color:#4b5563">[${l.t}]</span> ${escDbg(l.msg)}</div>`
    ).join('');
  }

  // ── Onglet FILTRES ──
  function renderFilterCheck(){
    const fc = document.getElementById('dbg-filter-check');
    fc.style.display='block';
    document.getElementById('dbg-state').style.display='none';
    document.getElementById('dbg-log').style.display='none';

    try {
      if(typeof DATA==='undefined'||typeof S==='undefined'){
        fc.innerHTML='<div style="color:#f87171;padding:12px">DATA ou S non accessible</div>';
        return;
      }

      // Reproduire les filtres isFixed / isPortable
      const cats_fixed = ['Boitier fixe','Cellule capteur','Carte électronique','Accessoire fixe','Centrale détection','Module centrale'];
      const cats_port  = ['Capteur','Boitier','Electronique','Accessoire'];
      const isFix = d => cats_fixed.includes(d.categorie)||d.techno==='Fixe'||(d.appareil&&d.appareil.toLowerCase().includes('fixe'));
      const isPort= d => cats_port.includes(d.categorie)&&!isFix(d);
      const isErr = d => d.categorie==='Code erreur';
      const isCat = d => d.categorie==='Appareil neuf';
      const isCmp = d => ['Compatibilité','Règle'].includes(d.categorie)||d.marque==='Compatibilité inter-marques';

      const bFixed = d=>!isCat(d)&&!isErr(d)&&!isCmp(d)&&isFix(d);
      const bPort  = d=>!isCat(d)&&!isErr(d)&&!isCmp(d)&&isPort(d);

      const fixAll   = DATA.filter(bFixed);
      const portAll  = DATA.filter(bPort);
      const errAll   = DATA.filter(isErr);
      const catAll   = DATA.filter(isCat);
      const uncatAll = DATA.filter(d=>!isFix(d)&&!isPort(d)&&!isErr(d)&&!isCat(d)&&!isCmp(d));

      // Résultat avec filtre marque actuel
      const fixFil = fixAll.filter(d=>!S.marque||d.marque===S.marque);
      const portFil= portAll.filter(d=>!S.marque||d.marque===S.marque);

      // Marques disponibles
      const mFix  = [...new Set(fixAll.map(d=>d.marque))].sort();
      const mPort = [...new Set(portAll.map(d=>d.marque))].sort();

      const row=(label,val,cls)=>`<div class="dfc-row"><span>${label}</span><span class="${cls}">${val}</span></div>`;

      fc.innerHTML = `
<div style="color:#7c3aed;font-weight:700;padding:0 12px 4px">── DONNÉES ──</div>
<div style="padding:0 12px">
${row('Total DATA', DATA.length, DATA.length>0?'dfc-ok':'dfc-err')}
${row('Fixe pièces', fixAll.length, fixAll.length>0?'dfc-ok':'dfc-err')}
${row('Portable pièces', portAll.length, portAll.length>0?'dfc-ok':'dfc-err')}
${row('Codes erreur', errAll.length, errAll.length>0?'dfc-ok':'dfc-warn')}
${row('Catalogue', catAll.length, catAll.length>0?'dfc-ok':'dfc-warn')}
${row('Non classifiés', uncatAll.length, uncatAll.length===0?'dfc-ok':'dfc-warn')}
</div>
<div style="color:#7c3aed;font-weight:700;padding:8px 12px 4px">── FILTRES ACTIFS ──</div>
<div style="padding:0 12px">
${row('S.section', S.section||'null', 'dfc-ok')}
${row('S.sub', S.sub||'null', 'dfc-ok')}
${row('S.marque', S.marque||'(aucun)', S.marque?'dfc-ok':'dfc-warn')}
${row('S.appareil', S.appareil||'(aucun)', S.appareil?'dfc-ok':'dfc-warn')}
${row('S.query', S.query||'(vide)', S.query?'dfc-ok':'dfc-warn')}
${row('Résultat fixe filtré', fixFil.length, fixFil.length>0?'dfc-ok':'dfc-err')}
${row('Résultat portable filtré', portFil.length, portFil.length>0?'dfc-ok':'dfc-err')}
</div>
<div style="color:#7c3aed;font-weight:700;padding:8px 12px 4px">── MARQUES DISPONIBLES ──</div>
<div style="padding:0 12px">
<div style="color:#60a5fa;font-size:10px;margin-bottom:2px">Fixe : ${mFix.join(' · ')}</div>
<div style="color:#a78bfa;font-size:10px">Portable : ${mPort.join(' · ')}</div>
</div>
${uncatAll.length>0?`
<div style="color:#fbbf24;font-weight:700;padding:8px 12px 4px">⚠ Non classifiés (${uncatAll.length})</div>
<div style="padding:0 12px;max-height:80px;overflow-y:auto">
${uncatAll.slice(0,10).map(d=>`<div style="font-size:10px;color:#9ca3af">${d.ref} | cat=${d.categorie} | tech=${d.techno}</div>`).join('')}
</div>`:''}
      `;
    } catch(e){
      fc.innerHTML = `<div style="color:#f87171;padding:12px">Erreur: ${escDbg(e.message)}</div>`;
    }
  }

  function escDbg(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Logger les actions utilisateur clés
  const origRenderPage = window.renderPage;
  if(typeof renderPage !== 'undefined'){
    const _rp = renderPage;
    window.renderPage = function(){
      try{
        dbgLog('action', `renderPage() section=${S.section} sub=${S.sub} marque=${S.marque||'—'} app=${S.appareil||'—'} q="${S.query}"`);
        _rp();
        if(panel.classList.contains('open') && dbgTab==='state') renderState();
        if(panel.classList.contains('open') && dbgTab==='filter') renderFilterCheck();
      } catch(e){
        dbgLog('err', `renderPage CRASH: ${e.message}`);
        console.error('renderPage crash:', e);
      }
    };
  }

  dbgLog('ok', `Debug panel initialisé. DATA: ${typeof DATA!=='undefined'?DATA.length:'?'} entrées`);
})();

</script>
